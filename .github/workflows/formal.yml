name: formal

# Model-checks play-state sync (.claude/skills/verify-play-state-sync) and the scratch store
# (.claude/skills/verify-scratch) when a model or the code it covers changes. A covered file whose content
# differs from the recorded hash fails the run (exit 3), so a change to that code needs the model re-read
# and confirmed in the same pull request. verify-play-state-sync's run.sh fails when one of its covered
# files is missing from these path filters.
on:
  pull_request:
    paths:
      - .claude/skills/verify-scratch/**
      - core/src/main/kotlin/finimal/core/Scratch.kt
      - core/src/main/kotlin/finimal/core/ScratchServer.kt
      - .claude/skills/verify-play-state-sync/**
      - .github/workflows/formal.yml
      - core/src/main/kotlin/finimal/core/PendingStore.kt
      - core/src/main/kotlin/finimal/core/PlayState.kt
      - shared/src/commonMain/kotlin/com/zakius/finimal/Platform.kt
      - shared/src/commonMain/kotlin/com/zakius/finimal/Server.kt
  push:
    branches: [main]
    paths:
      - .claude/skills/verify-scratch/**
      - core/src/main/kotlin/finimal/core/Scratch.kt
      - core/src/main/kotlin/finimal/core/ScratchServer.kt
      - .claude/skills/verify-play-state-sync/**
      - .github/workflows/formal.yml
      - core/src/main/kotlin/finimal/core/PendingStore.kt
      - core/src/main/kotlin/finimal/core/PlayState.kt
      - shared/src/commonMain/kotlin/com/zakius/finimal/Platform.kt
      - shared/src/commonMain/kotlin/com/zakius/finimal/Server.kt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  play-state-sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        with:
          path: ~/.cache/finimal-formal
          key: finimal-formal-${{ hashFiles('.claude/skills/verify-play-state-sync/run.sh') }}
          restore-keys: finimal-formal-
      - run: .claude/skills/verify-play-state-sync/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-output
          path: build/formal

  scratch:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        with:
          path: ~/.cache/finimal-formal
          key: finimal-formal-${{ hashFiles('.claude/skills/verify-scratch/run.sh') }}
          restore-keys: finimal-formal-
      - run: .claude/skills/verify-scratch/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-scratch-output
          path: build/formal
