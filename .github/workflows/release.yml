name: release

# Pull requests: core and desktop tests and a debug build. A v* tag: tests, the signed release APKs (tools/release.sh),
# the Linux Flatpak and the .deb and .rpm in parallel jobs, then a GitHub release once all pass. Its notes are the tagged commit's message
# body, followed by the generated changelog. Pushes to main: tests, an unsigned release build and the Flatpak, which
# save the Gradle and flatpak-builder caches.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The desktop player tests load the distribution's libmpv.
      - name: Update apt
        id: apt
        timeout-minutes: 10
        # The runner's Azure mirror of Ubuntu crawled at tens of kB/s, and the install outran its time limit on some
        # runs; Ubuntu's own mirror, which the containers use, was fast. GitHub's images list their mirrors in
        # apt-mirrors.txt (ubuntu.sources points there), Azure first. Output stays on so a slow fetch shows.
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update -q
          echo "debs=$(apt-get install --print-uris -qq libmpv2 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The packages (about 100 MB), keyed by the exact versions apt would fetch: an update makes a new entry.
      - uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-libmpv2-${{ steps.apt.outputs.debs }}
      - name: Install libmpv
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives && sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -q libmpv2
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
      - run: ./gradlew :core:test :desktop:test

  debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug

  # setup-gradle saves its cache only on the default branch, and a tag's run can't read another tag's cache, so
  # without this every release built from nothing (about 4.5 min).
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: release # the cache is keyed by job; app reads this one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:assembleRelease

  app:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          KEYSTORE_PROPERTIES="$RUNNER_TEMP/keystore.properties" tools/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/finimal-*.apk

  # The jpackage app image (Java runtime included), tarred: artifacts drop the executable bit.
  desktop-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # skiaCheck: the app image's Skia, its ICU data trimmed, breaks text as the original does (desktop/build.gradle.kts).
      - run: ./gradlew :desktop:createReleaseDistributable :desktop:skiaCheck && tar -C desktop/build/compose/binaries/main-release -cf desktop-image.tar app
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-image
          path: desktop-image.tar
      # ProGuard renames the desktop classes; the release keeps the mapping that reads their stack traces (retrace).
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mapping
          path: desktop/build/proguard-mapping.txt

  # libmpv and FFmpeg build here; flatpak-builder's cache keeps them while the manifest's modules are unchanged.
  flatpak:
    needs: desktop-image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: desktop-image
      - run: mkdir -p desktop/build/compose/binaries/main-release && tar -C desktop/build/compose/binaries/main-release -xf desktop-image.tar
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: finimal-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.zakius.finimal.yml
          cache-key: flatpak-${{ hashFiles('packaging/flatpak/io.github.zakius.finimal.yml') }}
          upload-artifact: false
      - name: Player check inside the Flatpak
        run: flatpak build flatpak_app /app/bin/finimal --check-player
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: finimal-x86_64.flatpak

  # .deb and .rpm on the distributions' Java and libmpv, each installed and checked before it can be published.
  linux-packages:
    needs: desktop-image
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: desktop-image
      - run: mkdir -p desktop/build/compose/binaries/main-release && tar -C desktop/build/compose/binaries/main-release -xf desktop-image.tar
      # The .rpm builds in a Fedora container (the script's way without rpmbuild): no apt on the runner, whose
      # mirror was slow.
      - run: tools/linux-packages.sh --no-gradle
      # In clean containers, not on the runner: no background upgrades holding apt, and no preinstalled JDKs to hide
      # what a user's system lacks. All three run at once; each has a step that shows its output, with its own limit.
      # --init: with timeout as a container's first process (bash execs the last command), Fedora's exited 125.
      - name: Start the install checks
        timeout-minutes: 5
        run: |
          deb='apt-get update -q > /dev/null && apt-get install -y -q /dist/finimal_*_amd64.deb > /tmp/apt.log || { tail -40 /tmp/apt.log; exit 1; }; timeout 120 finimal --check-player'
          docker run -d --init --name ubuntu -e DEBIAN_FRONTEND=noninteractive -v "$PWD/dist:/dist:ro" ubuntu:26.04 bash -c "$deb" &
          docker run -d --init --name debian -e DEBIAN_FRONTEND=noninteractive -v "$PWD/dist:/dist:ro" debian:trixie bash -c "$deb" &
          docker run -d --init --name fedora -v "$PWD/dist:/dist:ro" fedora:latest bash -c 'dnf -q -y install /dist/finimal-*.rpm && timeout 120 finimal --check-player' &
          wait
      - name: Install the .deb on Ubuntu 26.04 and check the player
        timeout-minutes: 10
        run: docker logs -f ubuntu; exit $(docker wait ubuntu)
      - name: Install the .deb on Debian 13 and check the player
        timeout-minutes: 10
        run: docker logs -f debian; exit $(docker wait debian)
      - name: Install the .rpm on Fedora and check the player
        timeout-minutes: 10
        run: docker logs -f fedora; exit $(docker wait fedora)
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/finimal_*_amd64.deb
            dist/finimal-*.rpm

  # The Windows app, each as an MSI and a portable zip: the full build carries its Java runtime and libmpv-2.dll
  # (Windows has no system libmpv); the small one finds or downloads both (tools/windows-packages.sh).
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # the small build's libmpv download, published once per libmpv build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - id: libmpv
        uses: actions/cache@v5
        with:
          path: desktop/resources/windows/libmpv-2.dll
          key: libmpv-windows-${{ hashFiles('tools/fetch-libmpv-windows.sh') }}
      - if: steps.libmpv.outputs.cache-hit != 'true'
        run: tools/fetch-libmpv-windows.sh
      # jpackage's WiX toolset, which the Compose plugin downloads (about 30 s) unless this zip is there.
      - uses: actions/cache@v5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/compose-jb/wix311.zip
          key: wix311
      - run: ./gradlew :desktop:packageReleaseMsi :desktop:createReleaseDistributable :desktop:skiaCheck
      # The launcher is a windowed program: run from bash it neither waited for the app nor passed on its result. Start-
      # Process waits for it and keeps its output and exit code.
      - name: Check the player
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -ArgumentList --check-player -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          if ($p.ExitCode -ne 0) { throw "--check-player exited $($p.ExitCode)" }
      # The check must be able to fail: without libmpv it has to.
      - name: The check fails without libmpv
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse desktop/build/compose/binaries/main-release/app/finimal -Filter libmpv-2.dll | Select-Object -First 1
          Move-Item $dll.FullName "$($dll.FullName).off"
          $p = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -ArgumentList --check-player -Wait -PassThru -RedirectStandardOutput check.txt
          Get-Content check.txt
          Move-Item "$($dll.FullName).off" $dll.FullName
          if ($p.ExitCode -eq 0) { throw "--check-player passed without libmpv: it doesn't check anything" }
      - name: A look at the window
        timeout-minutes: 3
        shell: pwsh
        run: |
          $app = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -PassThru
          Start-Sleep 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/windows-screen.png")
          Stop-Process $app
      # 7z's default level for both zips: -mx=9 took about a minute longer here for a zip 1% smaller.
      - name: Package the full zip
        run: |
          version=$(sed -n 's/^finimal.versionName=//p' gradle.properties)
          mkdir -p dist
          (cd desktop/build/compose/binaries/main-release/app && 7z a -tzip "$OLDPWD/dist/finimal-$version-windows-x64-full.zip" finimal > /dev/null)
          ls -l dist
      - name: Package the installers and the small build
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/windows-packages.sh
      # No Java on the PATH or in JAVA_HOME, no libmpv: the small build downloads them. One the runner registers (it
      # may have its own Java installs) is used instead, which the warning tells.
      - name: Check the small build
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:JAVA_HOME = $null
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process desktop/build/windows-small/finimal/finimal.exe -ArgumentList --check-player -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          if ($p.ExitCode -ne 0) { throw "--check-player exited $($p.ExitCode)" }
          if (-not (Select-String -Quiet -SimpleMatch "$env:LOCALAPPDATA\finimal\java" check.txt)) { Write-Warning "The small build ran on an installed Java, not the download" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/finimal-*.msi
            dist/finimal-*-windows-x64*.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screen
          path: windows-screen.png

  publish:
    needs: [app, test, flatpak, linux-packages, windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes come from the release commit, which needn't be the tagged one
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mapping
          path: dist
      - run: mv dist/finimal-x86_64.flatpak "dist/finimal-${GITHUB_REF_NAME#v}-x86_64.flatpak"
      - run: mv dist/proguard-mapping.txt "dist/finimal-${GITHUB_REF_NAME#v}-desktop-mapping.txt"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b --fixed-strings --grep "Release ${GITHUB_REF_NAME#v}" | grep -v '^Co-Authored-By' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/finimal-*.apk dist/finimal-*.flatpak dist/finimal_*.deb dist/finimal-*.rpm dist/finimal-*.msi dist/finimal-*-windows-x64*.zip dist/finimal-*-desktop-mapping.txt --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
