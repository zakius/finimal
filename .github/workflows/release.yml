name: release

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test assembleDebug
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAINFIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAINFIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAINFIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          PLAINFIN_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "plainfin-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "plainfin-${GITHUB_REF_NAME}.apk" --generate-notes
