name: release

# Pull requests: core and desktop tests and a debug build. A v* tag: tests, the signed release APKs (tools/release.sh),
# the Linux Flatpak and the .deb and .rpm in parallel jobs, then a GitHub release once all pass. Its notes are the tagged commit's message
# body, followed by the generated changelog. Pushes to main: tests, an unsigned release build and the Flatpak, which
# save the Gradle and flatpak-builder caches.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The desktop player tests load the distribution's libmpv.
      - name: Install libmpv
        timeout-minutes: 15
        # The runner's Azure mirror of Ubuntu crawled at tens of kB/s, and the install outran its time limit on some
        # runs; Ubuntu's own mirror, which the containers use, was fast. GitHub's images list their mirrors in
        # apt-mirrors.txt (ubuntu.sources points there), Azure first. Output stays on so a slow fetch shows.
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update -q
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -q libmpv2
      - run: ./gradlew :core:test :desktop:test

  debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug

  # setup-gradle saves its cache only on the default branch, and a tag's run can't read another tag's cache, so
  # without this every release built from nothing (about 4.5 min).
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: release # the cache is keyed by job; app reads this one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease

  app:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          KEYSTORE_PROPERTIES="$RUNNER_TEMP/keystore.properties" tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/finimal-*.apk

  # The jpackage app image (Java runtime included), tarred: artifacts drop the executable bit.
  desktop-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:createReleaseDistributable && tar -C desktop/build/compose/binaries/main-release -cf desktop-image.tar app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-image
          path: desktop-image.tar
      # ProGuard renames the desktop classes; the release keeps the mapping that reads their stack traces (retrace).
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mapping
          path: desktop/build/proguard-mapping.txt

  # libmpv and FFmpeg build here; flatpak-builder's cache keeps them while the manifest's modules are unchanged.
  flatpak:
    needs: desktop-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-image
      - run: mkdir -p desktop/build/compose/binaries/main-release && tar -C desktop/build/compose/binaries/main-release -xf desktop-image.tar
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: finimal-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.zakius.finimal.yml
          cache-key: flatpak-${{ hashFiles('packaging/flatpak/io.github.zakius.finimal.yml') }}
          upload-artifact: false
      - name: Player check inside the Flatpak
        run: flatpak build flatpak_app /app/bin/finimal --check-player
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: finimal-x86_64.flatpak

  # .deb and .rpm on the distributions' Java and libmpv, each installed and checked before it can be published.
  linux-packages:
    needs: desktop-image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-image
      - run: mkdir -p desktop/build/compose/binaries/main-release && tar -C desktop/build/compose/binaries/main-release -xf desktop-image.tar
      # The .rpm builds in a Fedora container (the script's way without rpmbuild): no apt on the runner, whose
      # mirror was slow.
      - run: tools/linux-packages.sh --no-gradle
      # In clean containers, not on the runner: no background upgrades holding apt, and no preinstalled JDKs to hide
      # what a user's system lacks. One step each, with its own limit.
      - name: Install the .deb on Ubuntu 24.04 and check the player
        timeout-minutes: 10
        run: docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -c 'apt-get update -q > /dev/null && apt-get install -y -q /dist/finimal_*_amd64.deb > /tmp/apt.log || { tail -40 /tmp/apt.log; exit 1; }; timeout 120 finimal --check-player'
      - name: Install the .deb on Debian 13 and check the player
        timeout-minutes: 10
        run: docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/dist:/dist:ro" debian:trixie bash -c 'apt-get update -q > /dev/null && apt-get install -y -q /dist/finimal_*_amd64.deb > /tmp/apt.log || { tail -40 /tmp/apt.log; exit 1; }; timeout 120 finimal --check-player'
      - name: Start Fedora
        timeout-minutes: 5
        run: docker run -d --name fedora -v "$PWD/dist:/dist:ro" fedora:latest sleep infinity
      - name: Install the .rpm on Fedora
        timeout-minutes: 10
        run: docker exec fedora bash -c 'dnf -q -y install /dist/finimal-*.rpm'
      - name: Check the player from the .rpm
        timeout-minutes: 3
        run: docker exec fedora timeout 120 finimal --check-player
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/finimal_*_amd64.deb
            dist/finimal-*.rpm

  # The Windows app: an MSI and a portable zip, carrying libmpv-2.dll (Windows has no system libmpv).
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: tools/fetch-libmpv-windows.sh
      - run: ./gradlew :desktop:packageReleaseMsi :desktop:createReleaseDistributable
      # The launcher is a windowed program: run from bash it neither waited for the app nor passed on its result. Start-
      # Process waits for it and keeps its output and exit code.
      - name: Check the player
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -ArgumentList --check-player -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          if ($p.ExitCode -ne 0) { throw "--check-player exited $($p.ExitCode)" }
      # The check must be able to fail: without libmpv it has to.
      - name: The check fails without libmpv
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse desktop/build/compose/binaries/main-release/app/finimal -Filter libmpv-2.dll | Select-Object -First 1
          Move-Item $dll.FullName "$($dll.FullName).off"
          $p = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -ArgumentList --check-player -Wait -PassThru -RedirectStandardOutput check.txt
          Get-Content check.txt
          Move-Item "$($dll.FullName).off" $dll.FullName
          if ($p.ExitCode -eq 0) { throw "--check-player passed without libmpv: it doesn't check anything" }
      - name: A look at the window
        timeout-minutes: 3
        shell: pwsh
        run: |
          $app = Start-Process desktop/build/compose/binaries/main-release/app/finimal/finimal.exe -PassThru
          Start-Sleep 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/windows-screen.png")
          Stop-Process $app
      - name: Package
        run: |
          version=$(sed -n 's/^finimal.versionName=//p' gradle.properties)
          mkdir -p dist
          cp desktop/build/compose/binaries/main-release/msi/*.msi "dist/finimal-$version-x64.msi"
          (cd desktop/build/compose/binaries/main-release/app && 7z a -tzip -mx=9 "$OLDPWD/dist/finimal-$version-windows-x64.zip" finimal > /dev/null)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/finimal-*.msi
            dist/finimal-*-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screen
          path: windows-screen.png

  publish:
    needs: [app, test, flatpak, linux-packages, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes come from the release commit, which needn't be the tagged one
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-mapping
          path: dist
      - run: mv dist/finimal-x86_64.flatpak "dist/finimal-${GITHUB_REF_NAME#v}-x86_64.flatpak"
      - run: mv dist/proguard-mapping.txt "dist/finimal-${GITHUB_REF_NAME#v}-desktop-mapping.txt"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b --fixed-strings --grep "Release ${GITHUB_REF_NAME#v}" | grep -v '^Co-Authored-By' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/finimal-*.apk dist/finimal-*.flatpak dist/finimal_*.deb dist/finimal-*.rpm dist/finimal-*.msi dist/finimal-*-windows-x64.zip dist/finimal-*-desktop-mapping.txt --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
